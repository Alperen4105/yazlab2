{% extends "base.html" %}
{% block content %}
<section class="auth-card">
  <h2>Parolayı Sıfırla</h2>
  {% if message %}
    <div class="alert {{ 'success' if success else 'error' }}">{{ message }}</div>
  {% endif %}
  {% if not success %}
  <form method="post">
    <input type="hidden" name="token" value="{{ token or '' }}" />
    <label>
      Yeni Şifre
      <input type="password" name="password" />
    </label>
    <label>
      Yeni Şifre (Tekrar)
      <input type="password" name="confirm_password" />
    </label>
    <button type="submit">Şifreyi Güncelle</button>
  </form>
  {% endif %}
</section>
{% endblock %}
