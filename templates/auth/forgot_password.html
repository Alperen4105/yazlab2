{% extends "base.html" %}
{% block content %}
<section class="auth-card">
  <h1>Şifremi Unuttum</h1>
  <p>Kayıtlı e-postanı gir, sıfırlama bağlantısı gönderelim.</p>
  {% if message %}
    <div class="alert success">{{ message }}</div>
  {% endif %}
  <form method="post">
    <label>E-posta
      <input type="email" name="email" placeholder="ornek@posta.com" required />
    </label>
    <button type="submit">Sıfırlama Linki Gönder</button>
  </form>
  <p class="muted"><a href="{{ url_for('login') }}">Giriş ekranına dön</a></p>
</section>
{% endblock %}
